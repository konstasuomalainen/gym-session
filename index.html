        <button class="btn small ghost" id="imp">Import</button>
      </div>
      <input type="file" id="file" accept="application/json" hidden>
      <p class="muted" style="font-size:var(--t-sub);margin:12px 0 0">${exportNudge()}</p>
    </div></div>`));
  $('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify(store,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    /* Minutes in the name, so two exports on one day do not collide. */
    a.download = 'sessions-' + new Date().toISOString().slice(0,16).replace(/[:T]/g,'-') + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    store.lastExport = new Date().toISOString(); save(); render();
  };
  $('#imp').onclick = () => $('#file').click();
  $('#file').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    e.target.value = '';   /* so picking the same file twice still fires */
    const r = new FileReader();
    r.onload = async () => {
      try{
        const data = JSON.parse(r.result);
        if(!Array.isArray(data.history)) throw new Error('bad file');
        if((Number(data.version) || 0) > SCHEMA) throw new Error('newer');
        /* Import replaces, it does not merge. Say so before doing it: the two
           buttons sit next to each other and there is no undo. */
        const incoming = data.history.length;
        const go = !store.history.length || await ask({
          title:'Replace everything?',
          body:'This phone has ' + store.history.length + ' session(s). The file has ' +
               incoming + '. Importing replaces what is here and cannot be undone.',
          confirmLabel:'Replace', danger:true
        });
        if(!go) return;
        store = adopt(data); save();
        toast('Imported ' + store.history.length + ' sessions');
        view = 'home'; render();
      }catch(err){
        toast(err.message === 'newer'
          ? 'That backup is from a newer version of the app'
          : 'That file could not be read');
      }
    };
    r.readAsText(f);
  };

  /* Counters, rotation and erase are all things you touch once, so they fold
     away behind one disclosure instead of sitting level with Backup. */
  app.appendChild(el(`
    <details class="card"><summary>Programme and counters</summary><div class="pad">
      <div class="eyebrow">Session counters</div>
      <p class="mono" style="margin:8px 0 12px">Gym ${store.gymDone} &nbsp; Home ${store.homeDone}</p>
      <p class="muted" style="font-size:var(--t-sub);margin:0 0 12px">The counter picks the next workout in the rotation. Adjust it if you started mid programme.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn small ghost" id="gplus">Gym +1</button>
        <button class="btn small ghost" id="gminus">Gym -1</button>
        <button class="btn small ghost" id="hplus">Home +1</button>
        <button class="btn small ghost" id="hminus">Home -1</button>
      </div>
      <div class="eyebrow" style="margin-top:18px">Rotation</div>
      <p class="mono" style="font-size:var(--t-sub);margin:8px 0 0;line-height:1.8">
        Gym: ${PROGRAM.gym.order.map(id => esc(tmpl('gym',id).name)).join(' &rarr; ')} &rarr; repeat<br>
        Home: ${PROGRAM.home.order.map(id => esc(tmpl('home',id).name)).join(', ')}, daily
      </p>
      <p class="muted" style="font-size:var(--t-sub);margin-top:12px">To change exercises, edit the PROGRAM block at the top of index.html. History is kept by exercise id, so keep an id the same if you rename the exercise.</p>
      <div class="eyebrow" style="margin-top:18px">This phone</div>
      <p class="mono" style="font-size:var(--t-sub);margin:8px 0 0" id="storageLine">Schema v${store.version} &middot; ${store.history.length} session(s)</p>
      <div style="margin-top:16px"><button class="btn small danger" id="erase">Erase everything</button></div>
    </div></details>`));
  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(e => {
      const l = $('#storageLine');
      if(l && e.usage != null) l.textContent += ' · ' + Math.round(e.usage/1024) + ' kB used';
    }).catch(() => {});
  }
  $('#gplus').onclick = () => { store.gymDone++; save(); render(); };
  $('#gminus').onclick = () => { store.gymDone = Math.max(0, store.gymDone-1); save(); render(); };
  $('#hplus').onclick = () => { store.homeDone++; save(); render(); };
  $('#hminus').onclick = () => { store.homeDone = Math.max(0, store.homeDone-1); save(); render(); };

  $('#erase').onclick = async () => {
    if(await ask({title:'Erase everything?',
                  body:'All ' + store.history.length + ' session(s) and both counters. This cannot be undone, and there is no backup unless you have exported one.',
                  confirmLabel:'Erase', danger:true})){
      store = blank(); save(); view = 'home'; render();
    }
  };
}

document.querySelectorAll('.navlinks button').forEach(b => {
  b.onclick = () => { view = b.dataset.nav; openEx = null; render(); };
});

load();
if(store.active) { view = 'home'; }
render();
resumeTimer();

/* Ask for the persistent storage bucket, which is the one Chrome does not
   evict when the device runs short of space. Granted silently on an installed
   app; a no-op everywhere else. Export is still the only real backup. */
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* Offline support. Registration is deliberately last so a failure here
   can never stop the app from rendering. */
if('serviceWorker' in navigator &&
   (location.protocol === 'https:' || location.hostname === 'localhost')){
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
