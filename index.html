<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7DECB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sessions">
<title>Sessions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#E7DECB;
  --card:#F5F0E4;
  --chalk:#FCFAF4;
  --ink:#17150F;
  --muted:#7C7364;
  --hair:#D3C7AE;
  --blue:#1D4E89;
  --red:#B93B2B;
  --ok:#3D6B4A;
  --pad:18px;
  --r:4px;
  --display:'Big Shoulders Display',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--floor);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
/* court line texture */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(90deg,rgba(23,21,15,.035) 0 1px,transparent 1px 46px),
    radial-gradient(circle at 50% -10%,rgba(29,78,137,.10),transparent 55%);
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 var(--pad) 120px}

/* header */
header{
  position:sticky;top:0;z-index:20;background:var(--floor);
  border-bottom:2px solid var(--ink);
  padding:14px var(--pad) 10px;margin:0 calc(var(--pad)*-1) 20px;
  display:flex;align-items:baseline;gap:12px;
}
.mark{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.mark em{font-style:normal;color:var(--red)}
.navlinks{margin-left:auto;display:flex;gap:14px}
.navlinks button{
  background:none;border:none;padding:4px 0;cursor:pointer;color:var(--muted);
  font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
}
.navlinks button[aria-current="true"]{color:var(--ink);box-shadow:0 2px 0 var(--red)}

/* generic */
.eyebrow{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);margin-bottom:14px}
.pad{padding:16px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.rule{height:2px;background:var(--ink);margin:22px 0}

/* next session hero */
.hero{position:relative;overflow:hidden;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:20px 18px 18px;margin-bottom:14px}
.hero::after{
  content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;
  border:3px solid var(--blue);border-radius:50%;opacity:.16;
}
.hero .num{
  font-family:var(--display);font-weight:800;font-size:88px;line-height:.8;
  letter-spacing:-.02em;color:var(--blue);margin:6px 0 2px;
}
.hero .num small{font-size:22px;color:var(--muted);letter-spacing:.05em;margin-left:8px;font-weight:700}
.hero h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:8px 0 4px}
.hero .focus{font-size:14px;color:var(--muted);margin:0}
.stripe{height:6px;background:var(--red);width:64px;margin:14px 0 0}

/* buttons */
.btn{
  display:block;width:100%;text-align:center;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;
  padding:14px;border:2px solid var(--ink);border-radius:var(--r);
  background:var(--blue);color:var(--chalk);transition:transform .12s ease,filter .12s ease;
}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{font-size:15px;padding:9px 12px;width:auto;display:inline-block}
.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--card)}
.stats div{padding:12px 10px;border-right:2px solid var(--ink)}
.stats div:last-child{border-right:none}
.stats b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}
.stats span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* session view */
.sesshead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sesshead h2{font-family:var(--display);font-weight:800;font-size:40px;line-height:.9;text-transform:uppercase;margin:2px 0 0}
.sesshead .n{font-family:var(--mono);font-size:14px;color:var(--muted)}

.ex{border:2px solid var(--ink);border-radius:var(--r);background:var(--card);margin-bottom:12px;overflow:hidden}
.ex.done{background:var(--chalk)}
.exhead{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;width:100%;background:none;border:none;text-align:left;font:inherit;color:inherit}
.exhead .tick{
  flex:0 0 26px;height:26px;border:2px solid var(--ink);border-radius:50%;
  display:grid;place-items:center;font-size:14px;font-weight:700;background:transparent;
}
.ex.done .tick{background:var(--ok);color:var(--chalk);border-color:var(--ok)}
.exhead h3{font-family:var(--display);font-weight:700;font-size:23px;line-height:1;text-transform:uppercase;margin:0;letter-spacing:.02em}
.exhead .sub{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:3px}
.exbody{padding:0 14px 14px;border-top:2px dashed var(--hair)}
.exbody .cue{font-size:13px;color:var(--muted);margin:12px 0 4px}
.exbody a.demo{font-size:12px;color:var(--blue);font-weight:600}
.last{font-family:var(--mono);font-size:12px;color:var(--blue);margin:10px 0 12px;padding:8px 10px;background:rgba(29,78,137,.07);border-left:3px solid var(--blue)}

.setrow{border-top:1px solid var(--hair);padding:10px 0}
.setgrid{display:grid;grid-template-columns:26px 1fr 1fr 42px;gap:8px;align-items:center}
.setgrid .idx{font-family:var(--mono);font-size:13px;color:var(--muted)}
.setgrid input{
  width:100%;font-family:var(--mono);font-size:19px;font-weight:600;text-align:center;
  padding:10px 4px;border:2px solid var(--hair);border-radius:var(--r);background:var(--chalk);color:var(--ink);
  -moz-appearance:textfield;
}
.setgrid input::-webkit-outer-spin-button,.setgrid input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.setgrid input:focus{border-color:var(--blue)}
.unit{position:relative}
.unit::after{content:attr(data-u);position:absolute;right:7px;bottom:4px;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.08em}
.setdone{border:2px solid var(--hair);background:var(--chalk);border-radius:var(--r);height:42px;cursor:pointer;font-size:16px;color:var(--muted)}
.setdone[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--chalk)}
.effort{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.effort button{
  padding:8px 2px;border:2px solid var(--hair);background:var(--chalk);border-radius:var(--r);cursor:pointer;
  font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
}
.effort button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--chalk)}
.exactions{display:flex;gap:8px;margin-top:12px}
.linkbtn{background:none;border:none;padding:6px 0;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}

/* cardio */
.cardio{border:2px solid var(--blue);background:rgba(29,78,137,.06)}
.presc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 14px}
.presc div{text-align:center;padding:10px 4px;background:var(--chalk);border:2px solid var(--ink);border-radius:var(--r)}
.presc b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.1}
.presc span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

textarea{
  width:100%;font-family:var(--body);font-size:15px;padding:10px;border:2px solid var(--hair);
  border-radius:var(--r);background:var(--chalk);color:var(--ink);resize:vertical;min-height:70px;
}

/* sticky footer */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--floor);
  border-top:2px solid var(--ink);padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));
}
.foot .inner{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.timer{
  flex:0 0 auto;font-family:var(--mono);font-size:20px;font-weight:600;padding:12px 14px;
  border:2px solid var(--ink);border-radius:var(--r);background:var(--card);cursor:pointer;min-width:92px;text-align:center;
}
.timer.run{background:var(--red);color:var(--chalk);border-color:var(--red)}

/* history */
.hitem{width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;cursor:pointer;font:inherit;color:inherit}
.hitem .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hitem h3{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;margin:0;line-height:1}
.hitem .date{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hitem .detail{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;white-space:pre-wrap;line-height:1.6}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:2px dashed var(--hair);border-radius:var(--r)}

.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:50;
  background:var(--ink);color:var(--chalk);padding:10px 16px;border-radius:var(--r);
  font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.toast.show{opacity:1}

.fadein{animation:rise .32s ease both}
.fadein:nth-child(2){animation-delay:.04s}
.fadein:nth-child(3){animation-delay:.08s}
.fadein:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">Sess<em>i</em>ons</div>
    <nav class="navlinks">
      <button data-nav="home">Now</button>
      <button data-nav="history">Log</button>
      <button data-nav="data">Data</button>
    </nav>
  </header>
  <main id="app"></main>
</div>
<div class="foot" id="foot" hidden></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   PROGRAM. Edit this block to change the routine.
   sets/reps are targets only. Nothing else in the file
   needs to change when you edit exercises.
   ============================================================ */
const PROGRAM = {
  gym: {
    order: ['upperA','upperB','lower'],
    templates: {
      upperA: {
        name: 'Upper A',
        focus: 'Back and arms, pull emphasis',
        exercises: [
          {id:'latpull',  name:'Lat pulldown',        sets:3, reps:'8 to 12',  cue:'Pull the elbows down to the hips, chest tall, no leaning back.', link:''},
          {id:'csrow',    name:'Chest supported row', sets:3, reps:'8 to 12',  cue:'Chest stays on the pad. Squeeze for a beat at the back.', link:''},
          {id:'cablerow', name:'Seated cable row',    sets:3, reps:'10 to 12', cue:'Neutral grip, shoulders down, no torso swing.', link:''},
          {id:'facepull', name:'Cable face pull',     sets:2, reps:'12 to 15', cue:'Light. Pull to the forehead, elbows high.', link:''},
          {id:'curl',     name:'Cable or dumbbell curl', sets:3, reps:'10 to 12', cue:'Elbows pinned to the ribs.', link:''},
          {id:'hammer',   name:'Hammer curl',         sets:2, reps:'10 to 12', cue:'Thumbs up, controlled on the way down.', link:''}
        ]
      },
      upperB: {
        name: 'Upper B',
        focus: 'Chest and shoulders, press emphasis',
        exercises: [
          {id:'chestpress', name:'Chest press machine', sets:3, reps:'8 to 12',  cue:'Handles at mid chest height, full stretch at the back.', link:''},
          {id:'incline',    name:'Incline press',       sets:3, reps:'8 to 12',  cue:'Machine or dumbbells, about 30 degrees.', link:''},
          {id:'fly',        name:'Cable fly',           sets:2, reps:'12 to 15', cue:'Soft elbows, think about hugging, not pushing.', link:''},
          {id:'ohp',        name:'Shoulder press machine', sets:3, reps:'8 to 10', cue:'Ribs down, do not arch the lower back.', link:''},
          {id:'lateral',    name:'Cable lateral raise', sets:3, reps:'12 to 15', cue:'Lead with the elbow, stop at shoulder height.', link:''},
          {id:'pushdown',   name:'Triceps pushdown',    sets:3, reps:'10 to 12', cue:'Elbows locked at the sides.', link:''}
        ]
      },
      lower: {
        name: 'Lower',
        focus: 'Legs, moderate volume, machines',
        exercises: [
          {id:'legpress', name:'Leg press',        sets:3, reps:'10 to 12', cue:'Feet mid platform, knees track over the toes, no lower back rounding.', link:''},
          {id:'hamcurl',  name:'Seated hamstring curl', sets:3, reps:'10 to 12', cue:'Slow on the return, that is where the work is.', link:''},
          {id:'hipthrust',name:'Hip thrust',       sets:3, reps:'8 to 12',  cue:'Chin tucked, squeeze at the top, ribs down.', link:''},
          {id:'calf',     name:'Calf raise',       sets:3, reps:'12 to 15', cue:'Full stretch at the bottom, pause at the top.', link:''},
          {id:'backext',  name:'Back extension',   sets:2, reps:'12 to 15', cue:'Bodyweight is plenty. Stop at straight, do not hyperextend.', link:''}
        ]
      }
    }
  },
  home: {
    order: ['homeA'],
    templates: {
      homeA: {
        name: 'Home',
        focus: 'Walk plus a short bodyweight block',
        exercises: [
          {id:'pushup',  name:'Push-ups or incline push-ups', sets:3, reps:'as many as feel solid', cue:'Hands under the shoulders, body in one line. Use the sofa arm to raise the hands if needed.', link:'', unit:'reps'},
          {id:'plank',   name:'Plank',    sets:3, reps:'30 to 45 sec', cue:'Log seconds in the reps box. Squeeze the glutes.', link:'', unit:'sec'},
          {id:'birddog', name:'Bird dog', sets:2, reps:'8 each side',  cue:'Slow. Hips stay level, no rotation.', link:'', unit:'reps'},
          {id:'deadbug', name:'Deadbug',  sets:2, reps:'8 each side',  cue:'Lower back stays flat on the floor the whole time.', link:'', unit:'reps'}
        ]
      }
    }
  }
};

/* Walk ramp. Index is the session number in that track. */
function cardioFor(track, n){
  if(track === 'gym'){
    const mins = [10,12,15,18,20,22,25,25,28,30];
    return {
      minutes: mins[Math.min(n-1, mins.length-1)],
      incline: Math.min(3 + Math.floor((n-1)/3), 8),
      speed:   n <= 4 ? 3.5 : 4.0,
      when:    'after the lifting'
    };
  }
  const mins = [20,25,30,35,40,45];
  return {
    minutes: mins[Math.min(n-1, mins.length-1)],
    incline: Math.min(3 + Math.floor((n-1)/2), 9),
    speed:   n <= 4 ? 3.5 : 4.0,
    when:    'before or after the bodyweight block'
  };
}

const EFFORT = ['Easy','OK','Hard','Max'];

/* ============================================================
   Storage
   ============================================================ */
const KEY = 'sessions.v1';
const SCHEMA = 1;
let store = null;

function blank(){ return {version:SCHEMA, gymDone:0, homeDone:0, active:null, history:[]}; }

/* Bring a stored object of any older shape up to SCHEMA.
   To change the shape: bump SCHEMA, then append one block below.
   Never edit an existing block. Data in the wild has already run it. */
function migrate(data){
  let v = Number(data.version) || 0;
  if(v === 0){
    /* Before versioning. The shape already matches 1, so just stamp it. */
    v = 1;
  }
  /* if(v === 1){ ...reshape data...; v = 2; } */
  data.version = v;
  return data;
}

/* Migrate, then defend against a truncated or hand-edited file. */
function adopt(data){
  const s = Object.assign(blank(), migrate(data));
  if(!Array.isArray(s.history)) s.history = [];
  s.history = s.history.filter(x => x && x.track && x.templateId);
  s.history.forEach(x => { if(!x.ex) x.ex = {}; if(!x.cardio) x.cardio = {}; });
  s.gymDone = Math.max(0, Math.floor(Number(s.gymDone)) || 0);
  s.homeDone = Math.max(0, Math.floor(Number(s.homeDone)) || 0);
  if(s.active && !(s.active.track && s.active.templateId && s.active.ex)) s.active = null;
  if(s.active && !s.active.cardio){
    s.active.cardio = {...cardioFor(s.active.track, s.active.num || 1), actual:'', done:false};
  }
  return s;
}

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  try{
    store = raw ? adopt(JSON.parse(raw)) : blank();
  }catch(e){
    store = blank();
    if(raw) keepCorrupt(raw);
  }
  if(raw && store.version === SCHEMA) save();
}

/* Never silently drop unreadable data. Park it so it can be recovered by hand. */
function keepCorrupt(raw){
  try{ localStorage.setItem(KEY + '.corrupt.' + Date.now(), raw); }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ toast('Could not save to this browser'); }
}

/* ============================================================
   Helpers
   ============================================================ */
const $ = sel => document.querySelector(sel);
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}) + ' ' +
         d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
/* A session in history can name a template that has since been edited out of
   PROGRAM. Degrade to a stub rather than throwing and taking the Log view down. */
function tmpl(track, id){
  const t = PROGRAM[track] && PROGRAM[track].templates[id];
  return t || {name:id || 'Unknown', focus:'No longer in the programme', exercises:[]};
}
function nextTemplateId(track){
  const o = PROGRAM[track].order;
  const done = track === 'gym' ? store.gymDone : store.homeDone;
  return o[done % o.length];
}
function lastFor(exId){
  for(let i = store.history.length - 1; i >= 0; i--){
    const s = store.history[i];
    const sets = s.ex && s.ex[exId];
    if(sets && sets.some(x => x && (x.w || x.r))) return {sets, when:s.finishedAt};
  }
  return null;
}
function setLine(sets){
  if(!Array.isArray(sets)) return '';
  return sets.filter(x => x && (x.w || x.r))
    .map(x => (x.w ? x.w + ' kg' : 'bw') + ' x ' + (x.r || '?') + (x.e ? ' ' + EFFORT[x.e-1].toLowerCase() : ''))
    .join('   ');
}

/* ============================================================
   Views
   ============================================================ */
let view = 'home';
let openEx = null;

function render(){
  document.querySelectorAll('.navlinks button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.nav === view ? 'true' : 'false'));
  const app = $('#app');
  app.innerHTML = '';
  $('#foot').hidden = true;
  $('#foot').innerHTML = '';
  if(view === 'home') renderHome(app);
  else if(view === 'session') renderSession(app);
  else if(view === 'history') renderHistory(app);
  else renderData(app);
  window.scrollTo(0,0);
}

function renderHome(app){
  const a = store.active;
  if(a){
    const t = tmpl(a.track, a.templateId);
    app.appendChild(el(`
      <div class="hero fadein">
        <div class="eyebrow">In progress</div>
        <div class="num">${a.num}<small>${a.track === 'gym' ? 'GYM' : 'HOME'}</small></div>
        <h2>${esc(t.name)}</h2>
        <p class="focus">Started ${fmtDate(a.startedAt)}</p>
        <div class="stripe"></div>
      </div>`));
    const resume = el('<button class="btn fadein">Resume session</button>');
    resume.onclick = () => { view = 'session'; openEx = null; render(); };
    app.appendChild(resume);
    const drop = el('<button class="linkbtn" style="margin-top:10px">Discard this session</button>');
    drop.onclick = () => {
      if(confirm('Discard the session in progress? Nothing will be saved.')){
        store.active = null; save(); render();
      }
    };
    app.appendChild(drop);
    app.appendChild(el('<div class="rule"></div>'));
  }

  ['gym','home'].forEach(track => {
    if(a && a.track === track) return;
    const id = nextTemplateId(track);
    const t = tmpl(track, id);
    const n = (track === 'gym' ? store.gymDone : store.homeDone) + 1;
    const c = cardioFor(track, n);
    const box = el(`
      <div class="hero fadein">
        <div class="eyebrow">Next ${track === 'gym' ? 'gym' : 'home'} session</div>
        <div class="num">${n}<small>${track === 'gym' ? 'GYM' : 'HOME'}</small></div>
        <h2>${esc(t.name)}</h2>
        <p class="focus">${esc(t.focus)}</p>
        <p class="focus mono" style="margin-top:6px">Walk ${c.minutes} min at ${c.speed} km/h, ${c.incline} percent incline</p>
        <div class="stripe"></div>
      </div>`);
    app.appendChild(box);
    const b = el(`<button class="btn ${track === 'home' ? 'ghost' : ''} fadein" style="margin-bottom:16px">Start ${track === 'gym' ? 'gym' : 'home'} session</button>`);
    b.onclick = () => startSession(track);
    app.appendChild(b);
  });

  const last = store.history[store.history.length - 1];
  app.appendChild(el(`
    <div class="stats fadein">
      <div><b>${store.gymDone}</b><span>Gym done</span></div>
      <div><b>${store.homeDone}</b><span>Home done</span></div>
      <div><b>${last ? fmtDate(last.finishedAt).split(' ')[0] + ' ' + fmtDate(last.finishedAt).split(' ')[1] : '&ndash;'}</b><span>Last session</span></div>
    </div>`));
}

function startSession(track){
  const id = nextTemplateId(track);
  const n = (track === 'gym' ? store.gymDone : store.homeDone) + 1;
  const t = tmpl(track, id);
  const ex = {};
  t.exercises.forEach(e => { ex[e.id] = freshSets(e); });
  store.active = {
    track, num:n, templateId:id, startedAt:new Date().toISOString(),
    cardio:{...cardioFor(track,n), actual:'', done:false},
    ex, note:''
  };
  save();
  view = 'session'; openEx = t.exercises[0].id; render();
}

/* Blank sets for an exercise, used on start and when PROGRAM gains an
   exercise while a session is already running. */
function freshSets(exd){
  return Array.from({length:exd.sets}, () => ({w:'',r:'',e:0,done:false}));
}
function slotsFor(exd){
  const a = store.active;
  if(!Array.isArray(a.ex[exd.id])) a.ex[exd.id] = freshSets(exd);
  return a.ex[exd.id];
}
function exComplete(exId){
  const s = store.active.ex[exId];
  if(!Array.isArray(s) || !s.length) return false;
  return s.every(x => x.done) || s.every(x => x.w !== '' || x.r !== '');
}

function renderSession(app){
  const a = store.active;
  if(!a){ view = 'home'; return render(); }
  const t = tmpl(a.track, a.templateId);

  app.appendChild(el(`
    <div class="sesshead">
      <div>
        <div class="eyebrow">${a.track === 'gym' ? 'Gym' : 'Home'} session ${a.num}</div>
        <h2>${esc(t.name)}</h2>
      </div>
      <div class="n">${esc(t.focus)}</div>
    </div>`));

  if(a.num <= 3){
    app.appendChild(el(`
      <div class="card" style="border-color:var(--red)"><div class="pad">
        <div class="eyebrow" style="color:var(--red)">Ease in &middot; session ${a.num} of 3</div>
        <p style="margin:8px 0 0;font-size:14px">Two sets per exercise instead of three, and stop every set two or three reps short of failure. Drop the last exercise if you are cooked. The job of these three is to make the next one happen, not to leave you sore for four days.</p>
      </div></div>`));
  }

  /* cardio card */
  const c = a.cardio;
  const cardio = el(`
    <div class="card cardio">
      <div class="pad">
        <div class="eyebrow">Treadmill walk, ${esc(c.when)}</div>
        <div class="presc">
          <div><b>${c.minutes}</b><span>minutes</span></div>
          <div><b>${c.speed}</b><span>km/h</span></div>
          <div><b>${c.incline}</b><span>percent</span></div>
        </div>
        <div class="setgrid">
          <span class="idx"></span>
          <span class="unit" data-u="MIN DONE"><input type="number" inputmode="decimal" id="cardioAct" placeholder="${c.minutes}" value="${c.actual}"></span>
          <span class="muted" style="font-size:13px">Log what you actually walked</span>
          <button class="setdone" id="cardioDone" aria-pressed="${c.done}">&#10003;</button>
        </div>
      </div>
    </div>`);
  cardio.querySelector('#cardioAct').oninput = e => { a.cardio.actual = e.target.value; save(); };
  cardio.querySelector('#cardioDone').onclick = e => {
    a.cardio.done = !a.cardio.done;
    e.currentTarget.setAttribute('aria-pressed', a.cardio.done);
    save();
  };
  app.appendChild(cardio);

  /* exercises */
  t.exercises.forEach(exd => {
    const sets = slotsFor(exd);
    const done = exComplete(exd.id);
    const isOpen = openEx === exd.id;
    const card = el(`<div class="ex ${done ? 'done' : ''}"></div>`);

    const summary = sets.some(s => s.w || s.r) ? setLine(sets) : (exd.sets + ' x ' + exd.reps);
    const head = el(`
      <button class="exhead">
        <span class="tick">${done ? '&#10003;' : ''}</span>
        <span>
          <h3>${esc(exd.name)}</h3>
          <span class="sub">${esc(summary)}</span>
        </span>
      </button>`);
    head.onclick = () => { openEx = isOpen ? null : exd.id; render(); };
    card.appendChild(head);

    if(isOpen){
      const body = el('<div class="exbody"></div>');
      const prev = lastFor(exd.id);
      if(prev) body.appendChild(el(`<div class="last">Last time: ${esc(setLine(prev.sets))}</div>`));
      body.appendChild(el(`<p class="cue">${esc(exd.cue)} <span class="mono">Target ${exd.sets} x ${esc(exd.reps)}</span></p>`));
      if(exd.link) body.appendChild(el(`<a class="demo" href="${esc(exd.link)}" target="_blank" rel="noopener">Watch the movement</a>`));

      sets.forEach((s, i) => {
        const row = el(`
          <div class="setrow">
            <div class="setgrid">
              <span class="idx">${i+1}</span>
              <span class="unit" data-u="KG"><input type="number" inputmode="decimal" step="0.5" value="${s.w}" placeholder="${prev && prev.sets[i] && prev.sets[i].w ? prev.sets[i].w : ''}"></span>
              <span class="unit" data-u="${esc((exd.unit || 'reps').toUpperCase())}"><input type="number" inputmode="numeric" value="${s.r}" placeholder="${prev && prev.sets[i] && prev.sets[i].r ? prev.sets[i].r : ''}"></span>
              <button class="setdone" aria-pressed="${s.done}">&#10003;</button>
            </div>
            <div class="effort">
              ${EFFORT.map((lab,k)=>`<button aria-pressed="${s.e === k+1}" data-e="${k+1}">${lab}</button>`).join('')}
            </div>
          </div>`);
        const [wIn, rIn] = row.querySelectorAll('input');
        wIn.oninput = e => { s.w = e.target.value; save(); };
        rIn.oninput = e => { s.r = e.target.value; save(); };
        row.querySelector('.setdone').onclick = e => {
          s.done = !s.done;
          e.currentTarget.setAttribute('aria-pressed', s.done);
          if(s.done) startTimer(90);
          save(); updateHeadState(card, exd.id);
        };
        row.querySelectorAll('.effort button').forEach(b => {
          b.onclick = () => {
            const v = Number(b.dataset.e);
            s.e = (s.e === v) ? 0 : v;
            row.querySelectorAll('.effort button').forEach(x =>
              x.setAttribute('aria-pressed', Number(x.dataset.e) === s.e));
            save();
          };
        });
        body.appendChild(row);
      });

      const actions = el('<div class="exactions"></div>');
      const addSet = el('<button class="linkbtn">Add a set</button>');
      addSet.onclick = () => { sets.push({w:'',r:'',e:0,done:false}); save(); render(); };
      const copyLast = el('<button class="linkbtn" style="margin-left:auto">Copy last time</button>');
      copyLast.onclick = () => {
        if(!prev) return toast('No previous data for this one yet');
        sets.forEach((s,i) => { if(prev.sets[i]){ s.w = prev.sets[i].w; s.r = prev.sets[i].r; } });
        save(); render();
      };
      actions.appendChild(addSet); actions.appendChild(copyLast);
      body.appendChild(actions);
      card.appendChild(body);
    }
    app.appendChild(card);
  });

  /* note */
  const note = el(`
    <div class="card"><div class="pad">
      <div class="eyebrow" style="margin-bottom:8px">Note</div>
      <textarea placeholder="Anything worth knowing next time. Machine settings, a niggle, how it felt.">${esc(a.note)}</textarea>
    </div></div>`);
  note.querySelector('textarea').oninput = e => { a.note = e.target.value; save(); };
  app.appendChild(note);

  /* footer */
  const foot = $('#foot');
  foot.hidden = false;
  foot.innerHTML = '<div class="inner"><button class="timer" id="timerBtn">Rest</button><button class="btn" id="finishBtn">Finish session</button></div>';
  foot.querySelector('#timerBtn').onclick = () => timerRunning ? stopTimer() : startTimer(90);
  foot.querySelector('#finishBtn').onclick = finishSession;
  paintTimer();
}

function updateHeadState(card, exId){
  const done = exComplete(exId);
  card.classList.toggle('done', done);
  card.querySelector('.tick').innerHTML = done ? '&#10003;' : '';
}

function finishSession(){
  const a = store.active;
  const logged = Object.values(a.ex).some(sets => sets.some(s => s.w || s.r)) || a.cardio.done || a.cardio.actual;
  if(!logged && !confirm('Nothing is logged in this session. Finish it anyway?')) return;
  a.finishedAt = new Date().toISOString();
  store.history.push(a);
  if(a.track === 'gym') store.gymDone++; else store.homeDone++;
  store.active = null;
  stopTimer(); save();
  toast('Session ' + a.num + ' logged');
  view = 'home'; render();
}

/* rest timer */
let timerEnd = 0, timerRunning = false, timerInt = null;
function startTimer(sec){
  timerEnd = Date.now() + sec*1000; timerRunning = true;
  clearInterval(timerInt); timerInt = setInterval(paintTimer, 250); paintTimer();
}
function stopTimer(){ timerRunning = false; clearInterval(timerInt); paintTimer(); }
function paintTimer(){
  const b = document.querySelector('#timerBtn'); if(!b) return;
  if(!timerRunning){ b.textContent = 'Rest'; b.classList.remove('run'); return; }
  const left = Math.max(0, Math.round((timerEnd - Date.now())/1000));
  b.textContent = Math.floor(left/60) + ':' + String(left%60).padStart(2,'0');
  b.classList.add('run');
  if(left === 0){ stopTimer(); toast('Rest done'); if(navigator.vibrate) navigator.vibrate(200); }
}

function renderHistory(app){
  if(!store.history.length){
    app.appendChild(el('<div class="empty">No sessions logged yet. Start one from Now.</div>'));
    return;
  }
  [...store.history].reverse().forEach(s => {
    const t = tmpl(s.track, s.templateId);
    const item = el(`
      <button class="hitem">
        <span class="top">
          <h3>${esc(t.name)} &middot; ${s.num}</h3>
          <span class="date">${fmtDate(s.finishedAt)}</span>
        </span>
      </button>`);
    item.onclick = () => {
      let d = item.querySelector('.detail');
      if(d){ d.remove(); return; }
      /* Template order first, then anything logged under an id the template
         no longer lists, so renamed or retired exercises stay readable. */
      const names = new Map(t.exercises.map(e => [e.id, e.name]));
      Object.keys(s.ex).forEach(id => { if(!names.has(id)) names.set(id, id); });
      const lines = [...names].map(([id, name]) => {
        const line = setLine(s.ex[id] || []);
        return name + (line ? '\n  ' + line : '\n  not logged');
      });
      const c = s.cardio;
      const walk = c.speed
        ? 'Walk: ' + (c.actual || (c.done ? c.minutes : '0')) + ' min at ' + c.speed + ' km/h, ' + c.incline + ' percent'
        : 'Walk: not logged';
      item.appendChild(el(`<span class="detail">${esc(walk + '\n\n' + lines.join('\n') + (s.note ? '\n\n' + s.note : ''))}</span>`));
    };
    app.appendChild(item);
  });
}

function renderData(app){
  app.appendChild(el(`
    <div class="card"><div class="pad">
      <div class="eyebrow">Backup</div>
      <p style="margin:8px 0 14px">Everything lives in this browser only. Export now and then, and before you clear browser data or change phone.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn small" id="exp">Export</button>
        <button class="btn small ghost" id="imp">Import</button>
      </div>
      <input type="file" id="file" accept="application/json" hidden>
    </div></div>`));
  $('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify(store,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sessions-' + new Date().toISOString().slice(0,10) + '.json';
    a.click(); URL.revokeObjectURL(a.href);
  };
  $('#imp').onclick = () => $('#file').click();
  $('#file').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const data = JSON.parse(r.result);
        if(!Array.isArray(data.history)) throw new Error('bad file');
        if((Number(data.version) || 0) > SCHEMA) throw new Error('newer');
        store = adopt(data); save();
        toast('Imported ' + store.history.length + ' sessions');
        view = 'home'; render();
      }catch(err){
        toast(err.message === 'newer'
          ? 'That backup is from a newer version of the app'
          : 'That file could not be read');
      }
    };
    r.readAsText(f);
  };

  app.appendChild(el(`
    <div class="card"><div class="pad">
      <div class="eyebrow">Session counters</div>
      <p class="mono" style="margin:8px 0 12px">Gym ${store.gymDone} &nbsp; Home ${store.homeDone}</p>
      <p class="muted" style="font-size:13px;margin:0 0 12px">The counter picks the next workout in the rotation and sets the walk length. Adjust it if you started mid programme.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn small ghost" id="gplus">Gym +1</button>
        <button class="btn small ghost" id="gminus">Gym -1</button>
        <button class="btn small ghost" id="hplus">Home +1</button>
        <button class="btn small ghost" id="hminus">Home -1</button>
      </div>
    </div></div>`));
  $('#gplus').onclick = () => { store.gymDone++; save(); render(); };
  $('#gminus').onclick = () => { store.gymDone = Math.max(0, store.gymDone-1); save(); render(); };
  $('#hplus').onclick = () => { store.homeDone++; save(); render(); };
  $('#hminus').onclick = () => { store.homeDone = Math.max(0, store.homeDone-1); save(); render(); };

  app.appendChild(el(`
    <div class="card"><div class="pad">
      <div class="eyebrow">Rotation</div>
      <p class="mono" style="font-size:13px;margin:10px 0 0;line-height:1.8">
        Gym: ${PROGRAM.gym.order.map(id => tmpl('gym',id).name).join(' &rarr; ')} &rarr; repeat<br>
        Home: ${PROGRAM.home.order.map(id => tmpl('home',id).name).join(', ')}
      </p>
      <p class="muted" style="font-size:13px;margin-top:12px">To change exercises, edit the PROGRAM block at the top of index.html. History is kept by exercise id, so keep an id the same if you rename the exercise.</p>
    </div></div>`));

  const reset = el('<button class="linkbtn" style="color:var(--red)">Erase everything</button>');
  reset.onclick = () => {
    if(confirm('Erase all sessions and counters? This cannot be undone.')){
      store = blank(); save(); view = 'home'; render();
    }
  };
  app.appendChild(reset);
}

document.querySelectorAll('.navlinks button').forEach(b => {
  b.onclick = () => { view = b.dataset.nav; openEx = null; render(); };
});

load();
if(store.active) { view = 'home'; }
render();
</script>
</body>
</html>
